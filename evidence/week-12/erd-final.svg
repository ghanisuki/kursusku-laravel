<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f5132">ERD Final KursusKu - Course, Participant, Enrollment</text>

  <!-- COURSES -->
  <rect x="30" y="70" width="230" height="250" rx="8" fill="#f1f8f5" stroke="#0f8a6a" stroke-width="2"/>
  <rect x="30" y="70" width="230" height="36" rx="8" fill="#0f8a6a"/>
  <text x="145" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">courses</text>
  <g font-size="13" fill="#222">
    <text x="45" y="132">PK  id</text>
    <text x="45" y="156">UQ  code</text>
    <text x="45" y="180">name</text>
    <text x="45" y="204">description (nullable)</text>
    <text x="45" y="228">fee, quota</text>
    <text x="45" y="252">start_date</text>
    <text x="45" y="276">status (draft/open/closed)</text>
    <text x="45" y="300">created_at, updated_at</text>
  </g>

  <!-- ENROLLMENTS -->
  <rect x="335" y="70" width="230" height="250" rx="8" fill="#fff8e6" stroke="#c98a00" stroke-width="2"/>
  <rect x="335" y="70" width="230" height="36" rx="8" fill="#c98a00"/>
  <text x="450" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">enrollments</text>
  <g font-size="13" fill="#222">
    <text x="350" y="132">PK  id</text>
    <text x="350" y="156">FK  participant_id  (CASCADE)</text>
    <text x="350" y="180">FK  course_id  (CASCADE)</text>
    <text x="350" y="204">status (default: registered)</text>
    <text x="350" y="228">created_at, updated_at</text>
    <text x="350" y="264" font-weight="bold" fill="#8a5a00">UQ (participant_id, course_id)</text>
    <text x="350" y="284" font-size="11" fill="#8a5a00">satu participant, satu kali per course</text>
  </g>

  <!-- PARTICIPANTS -->
  <rect x="640" y="70" width="230" height="250" rx="8" fill="#f1f8f5" stroke="#0f8a6a" stroke-width="2"/>
  <rect x="640" y="70" width="230" height="36" rx="8" fill="#0f8a6a"/>
  <text x="755" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">participants</text>
  <g font-size="13" fill="#222">
    <text x="655" y="132">PK  id</text>
    <text x="655" y="156">name</text>
    <text x="655" y="180">UQ  email</text>
    <text x="655" y="204">phone (nullable)</text>
    <text x="655" y="228">created_at, updated_at</text>
  </g>

  <!-- relasi -->
  <line x1="260" y1="150" x2="335" y2="150" stroke="#333" stroke-width="2"/>
  <line x1="565" y1="150" x2="640" y2="150" stroke="#333" stroke-width="2"/>
  <text x="268" y="142" font-size="13" font-weight="bold">1</text>
  <text x="318" y="142" font-size="13" font-weight="bold">*</text>
  <text x="572" y="142" font-size="13" font-weight="bold">*</text>
  <text x="624" y="142" font-size="13" font-weight="bold">1</text>
  <text x="298" y="172" text-anchor="middle" font-size="11" fill="#555">hasMany</text>
  <text x="602" y="172" text-anchor="middle" font-size="11" fill="#555">belongsTo</text>

  <text x="450" y="360" text-anchor="middle" font-size="13" fill="#333">Course 1:M Enrollment  |  Participant 1:M Enrollment  |  Course M:N Participant melalui Enrollment</text>
  <text x="450" y="382" text-anchor="middle" font-size="12" fill="#666">Hapus Course atau Participant -> enrollment terkait ikut terhapus; entity di sisi lain tetap ada.</text>
</svg>
